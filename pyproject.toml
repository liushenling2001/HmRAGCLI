[project]
name = "hmragcli"
version = "0.1.0"
description = "Lightweight tagged knowledge base backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pgvector==0.4.2",
    "sqlalchemy==2.0.25",
    "psycopg[binary]==3.3.3",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pypdf==6.9.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
enhanced-docling = [
    "docling==2.78.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
