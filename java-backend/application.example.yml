server:
  port: 8012

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/hmrag
    username: postgres
    password: ""

hmrag:
  llm:
    provider: openai_compatible
    base-url: http://127.0.0.1:1234/v1
    api-key: ""
    model: your-local-llm-model
    connect-timeout-seconds: 5
    request-timeout-seconds: 60
    fail-on-error: true
  embedding:
    provider: openai_compatible
    base-url: http://127.0.0.1:1234/v1
    api-key: ""
    model: your-local-embedding-model
    connect-timeout-seconds: 5
    request-timeout-seconds: 60
    batch-size: 16
    fallback-dimensions: 32
    fail-on-error: true
  domain-knowledge:
    refinement-llm:
      provider: openai_compatible
      base-url: http://127.0.0.1:1234/v1
      api-key: ""
      model: your-domain-refinement-model
      connect-timeout-seconds: 5
      request-timeout-seconds: 120
      fail-on-error: true
      max-completion-tokens: 38400
      group-max-completion-tokens: 38400
      term-plan-max-completion-tokens: 8192
