<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HmRAGCLI</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.94);
      --border: #dbe3ef;
      --text: #182338;
      --muted: #62738f;
      --primary: #2563eb;
      --primary-dark: #1f4fd4;
      --shadow: 0 24px 60px rgba(24, 35, 56, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(22, 131, 93, 0.08), transparent 22%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 52%, #eef3f8 100%);
    }

    .shell {
      width: min(760px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 36px;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      display: grid;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
    }

    .card h2 {
      margin: 0;
      font-size: 20px;
    }

    .card p {
      margin: 0;
      font-size: 14px;
    }

    .card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">HmRAGCLI</div>
    <h1>离线工作台</h1>
    <p>这个页面已经跟随后端一起打进 `jar`。运维、扫描、建档队列和失败记录看运维台；查询页保留了入口，但要等 Java 查询接口接上后才能完整工作。</p>
    <div class="grid">
      <section class="card">
        <h2>运维台</h2>
        <p>查看扫描结果、阶段任务队列、文件级进度、错误明细。</p>
        <a href="/ui/ops.html">打开运维台</a>
      </section>
      <section class="card">
        <h2>查询页</h2>
        <p>静态页面已打包，等 `/api/v1/search` 和 `/api/v1/qa/query` 接到 Java 后即可切换。</p>
        <a href="/ui/index.html">打开查询页</a>
      </section>
    </div>
  </main>
</body>
</html>
