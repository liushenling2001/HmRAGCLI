<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HmRAGCLI Ops</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #fafafa; --bg-card: #ffffff; --bg-panel: #f5f5f5; --bg-input: #ffffff; --bg-hover: #f0f0f0; --bg-active: #e8e8e8;
        --text: #1a1a1a; --text-muted: #666666; --text-soft: #999999; --text-disabled: #cccccc;
        --border: #d4d4d4; --border-strong: #1a1a1a; --border-focus: #1a1a1a; --border-light: #e8e8e8;
        --success: #059669; --success-bg: #ecfdf5; --success-text: #047857;
        --warning: #d97706; --warning-bg: #fffbeb; --warning-text: #b45309;
        --error: #dc2626; --error-bg: #fef2f2; --error-text: #b91c1c;
        --info: #2563eb; --info-bg: #eff6ff; --info-text: #1d4ed8;
        --font-display: Georgia, 'Times New Roman', serif;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace;
        --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px; --text-xl: 18px; --text-2xl: 20px; --text-3xl: 24px; --text-4xl: 30px;
        --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px;
        --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px; --radius-full: 9999px;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 2px 4px rgba(0,0,0,0.06); --shadow-lg: 0 4px 8px rgba(0,0,0,0.08);
        --transition-fast: 120ms ease; --transition-base: 180ms ease; --transition-slow: 280ms ease;
        --max-width: 1400px; --header-height: 64px;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; font-size: 16px; -webkit-font-smoothing: antialiased; }
      body { min-height: 100%; font-family: var(--font-body); font-size: var(--text-base); line-height: 1.6; color: var(--text); background-color: var(--bg); }
      .graph-entry {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--text);
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        box-shadow: var(--shadow-lg);
      }
      .graph-entry:focus,
      .graph-entry:hover { background: #333; }
    </style>
    <script type="module" crossorigin src="/ui/assets/ops.js"></script>
    <link rel="modulepreload" crossorigin href="/ui/assets/base.js">
    <link rel="stylesheet" crossorigin href="/ui/assets/base.css">
    <link rel="stylesheet" crossorigin href="/ui/assets/ops.css">
  </head>
  <body>
    <a class="graph-entry" href="/ui/graph-pipeline.html">知识图谱</a>
    <div id="ops-static-shell" style="max-width:1400px;margin:0 auto;padding:32px 24px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:#1a1a1a;background:#fafafa;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;margin-bottom:24px;border:1px solid #d4d4d4;border-radius:12px;background:#ffffff;">
        <div>
          <div style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#666;">HmRAGCLI</div>
          <div style="font-size:28px;font-family:Georgia,'Times New Roman',serif;">Operations Dashboard</div>
        </div>
        <div style="font-size:13px;color:#666;">前端正在加载...</div>
      </div>
      <div style="padding:18px 20px;border:1px solid #d4d4d4;border-radius:12px;background:#ffffff;color:#666;">
        如果这里长时间不消失，说明前端运行阶段异常，但不会再出现纯白页。
      </div>
    </div>
    <div id="app"></div>
    <div id="boot-error" style="display:none;max-width:1100px;margin:24px auto;padding:16px;border:1px solid #fca5a5;background:#fff1f2;color:#7f1d1d;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;"></div>
    <script>
      (function () {
        const errorBox = document.getElementById('boot-error')
        const app = document.getElementById('app')
        window.__OPS_BOOT_STAGE__ = 'html_loaded'
        function show(message) {
          if (!errorBox) return
          errorBox.style.display = 'block'
          errorBox.textContent = message
        }
        window.addEventListener('error', function (event) {
          const msg = event && event.error
            ? (event.error.stack || event.error.message || String(event.error))
            : (event && event.message ? String(event.message) : 'Unknown boot error')
          show('[OPS UI BOOT ERROR]\\n' + msg)
        })
        window.addEventListener('unhandledrejection', function (event) {
          const reason = event && event.reason
          const msg = reason && reason.stack
            ? reason.stack
            : (reason && reason.message ? reason.message : String(reason || 'Unknown rejection'))
          show('[OPS UI UNHANDLED REJECTION]\\n' + msg)
        })
        setTimeout(function () {
          if (!app) return
          const hasContent = (app.textContent || '').trim().length > 0 || app.children.length > 0
          if (!hasContent && (!errorBox || errorBox.style.display === 'none')) {
            const stage = window.__OPS_BOOT_STAGE__ || 'unknown'
            const detail = window.__OPS_BOOT_ERROR__ || ''
            let message = '[OPS UI BOOT TIMEOUT]\\n页面脚本已加载但未渲染内容。'
            message += '\\nboot_stage=' + stage
            if (detail) {
              message += '\\nboot_error=' + detail
            }
            message += '\\n请把这段信息原样发回。'
            show(message)
          }
        }, 6000)
      })()
    </script>
  </body>
</html>
