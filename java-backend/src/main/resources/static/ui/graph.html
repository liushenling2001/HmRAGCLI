<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HmRAGCLI Knowledge Graph</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f2f4f7;
      --border: #d8dee8;
      --border-strong: #1f2937;
      --text: #172033;
      --muted: #69758a;
      --primary: #2563eb;
      --success: #047857;
      --warning: #b45309;
      --error: #b91c1c;
      --info-bg: #eff6ff;
      --success-bg: #ecfdf5;
      --warning-bg: #fffbeb;
      --error-bg: #fef2f2;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --mono: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: inherit; }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav a,
    button,
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--border-strong);
      background: var(--text);
      color: #fff;
    }

    button.danger {
      border-color: #fecaca;
      background: var(--error-bg);
      color: var(--error);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .56;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1.2fr) minmax(120px, .45fr) minmax(240px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 20px 0;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 24px;
      line-height: 1.1;
    }

    .notice {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--info-bg);
      color: #1d4ed8;
      white-space: pre-wrap;
    }

    .notice.error {
      border-color: #fecaca;
      background: var(--error-bg);
      color: var(--error);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .graph-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      margin-top: 16px;
    }

    .graph-canvas {
      position: relative;
      min-height: 680px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .graph-svg {
      width: 100%;
      height: 680px;
      display: block;
      touch-action: none;
      user-select: none;
    }

    .graph-edge line {
      stroke: #cbd5e1;
      stroke-width: 1.25;
      transition: stroke 140ms ease, stroke-width 140ms ease, opacity 140ms ease;
    }

    .graph-edge text {
      fill: #64748b;
      font-size: 10px;
      opacity: 0.78;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .graph-node {
      cursor: grab;
    }

    .graph-node:active {
      cursor: grabbing;
    }

    .graph-node circle {
      stroke: #ffffff;
      stroke-width: 2.5;
      filter: drop-shadow(0 7px 14px rgba(15, 23, 42, 0.16));
      transition: r 140ms ease, opacity 140ms ease, stroke 140ms ease;
    }

    .graph-node text {
      fill: #172033;
      font-size: 12px;
      font-weight: 700;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .graph-svg.is-focused .graph-node,
    .graph-svg.is-focused .graph-edge {
      opacity: 0.22;
    }

    .graph-svg.is-focused .graph-node.is-active,
    .graph-svg.is-focused .graph-edge.is-active {
      opacity: 1;
    }

    .graph-edge.is-active line {
      stroke: #2563eb;
      stroke-width: 2.4;
    }

    .graph-node.is-active circle {
      stroke: #2563eb;
    }

    .graph-stats {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 12px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    .graph-side {
      min-height: 680px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .graph-side h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .graph-side pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
    }

    .job-section {
      margin-top: 16px;
    }

    .job-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
      align-items: start;
    }

    .job-column {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .job-column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }

    .job-column-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .job-column-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .job-list {
      display: grid;
      gap: 10px;
      padding: 12px;
      max-height: 760px;
      overflow: auto;
    }

    .job-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .job-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .job-title {
      min-width: 0;
    }

    .job-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .job-title span {
      display: block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      word-break: break-all;
    }

    .coverage-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .coverage-item {
      min-width: 0;
      padding: 8px;
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .coverage-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .coverage-item strong {
      display: block;
      margin-top: 2px;
      font-size: 15px;
    }

    .job-error {
      color: var(--error);
      font-size: 12px;
      word-break: break-word;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    tbody tr:last-child td { border-bottom: 0; }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
    }

    .muted { color: var(--muted); }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.queued,
    .badge.running {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .badge.success {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge.failed {
      background: var(--error-bg);
      color: var(--error);
    }

    .summary {
      max-width: 360px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 34px 20px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      .topbar,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .actions {
        justify-content: flex-start;
      }

      .graph-panel {
        grid-template-columns: 1fr;
      }

      .job-board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">HmRAGCLI</div>
        <h1>知识图谱任务管理</h1>
      </div>
      <nav class="nav" aria-label="页面导航">
        <a href="/">首页</a>
        <a href="/ui/ops.html">运维台</a>
        <a href="http://127.0.0.1:7474/browser/" target="_blank" rel="noreferrer">Neo4j Browser</a>
      </nav>
    </header>

    <section class="toolbar" aria-label="筛选与操作">
      <label>
        状态
        <select id="status">
          <option value="">全部</option>
          <option value="queued">queued</option>
          <option value="running">running</option>
          <option value="success">success</option>
          <option value="failed">failed</option>
        </select>
      </label>
      <label>
        拉取数量
        <input id="limit" type="number" min="1" max="200" value="100" />
      </label>
      <label>
        数据源 ID（补建时可选）
        <input id="dataSourceId" type="text" placeholder="留空表示全部数据源" />
      </label>
      <div class="actions">
        <button id="refreshBtn" type="button">刷新</button>
        <button id="backfillBtn" type="button" class="primary">补建未构建图谱</button>
        <button id="batchBuildBtn" type="button">批量开始图谱抽取</button>
        <button id="batchRebuildBtn" type="button">重建成功任务</button>
        <button id="fusionBtn" type="button">执行实体融合</button>
      </div>
    </section>

    <section class="metrics" aria-label="任务统计">
      <div class="metric"><span>全部</span><strong id="countAll">0</strong></div>
      <div class="metric"><span>排队</span><strong id="countQueued">0</strong></div>
      <div class="metric"><span>运行</span><strong id="countRunning">0</strong></div>
      <div class="metric"><span>成功</span><strong id="countSuccess">0</strong></div>
      <div class="metric"><span>失败</span><strong id="countFailed">0</strong></div>
    </section>

    <div id="notice" class="notice"></div>

    <section class="job-section" aria-label="图谱浏览">
      <div class="section-head">
        <h2>图谱浏览</h2>
        <span>查看已融合的实体、状态和事实关系</span>
      </div>
      <section class="toolbar" aria-label="图谱浏览操作" style="padding-top:0;">
        <label>
          实体数量
          <input id="graphLimit" type="number" min="10" max="120" value="50" />
        </label>
        <label>
          筛选实体
          <input id="graphFilter" type="text" placeholder="输入实体名称过滤当前视图" />
        </label>
        <div></div>
        <div class="actions">
          <button id="loadGraphBtn" type="button" class="primary">查看图谱</button>
        </div>
      </section>
      <div class="graph-panel">
        <div class="graph-canvas">
          <div id="graphStats" class="graph-stats">图谱尚未加载</div>
          <svg id="graphSvg" class="graph-svg" role="img" aria-label="知识图谱"></svg>
        </div>
        <aside class="graph-side">
          <h3 id="graphDetailTitle">未选择节点</h3>
          <pre id="graphDetail">点击图中的实体或关系查看详情。</pre>
        </aside>
      </div>
    </section>

    <section class="job-board" aria-label="图谱任务看板">
      <section class="job-column" aria-label="运行中的图谱任务">
        <div class="job-column-head">
          <h2>运行中</h2>
          <span id="runningCount">0</span>
        </div>
        <div id="runningRows" class="job-list"><div class="empty">正在加载...</div></div>
      </section>
      <section class="job-column" aria-label="失败的图谱任务">
        <div class="job-column-head">
          <h2>失败</h2>
          <span id="failedCount">0</span>
        </div>
        <div id="failedRows" class="job-list"><div class="empty">正在加载...</div></div>
      </section>
      <section class="job-column" aria-label="成功的图谱任务">
        <div class="job-column-head">
          <h2>成功</h2>
          <span id="successCount">0</span>
        </div>
        <div id="successRows" class="job-list"><div class="empty">正在加载...</div></div>
      </section>
    </section>

    <footer class="footer">
      <span id="lastLoaded">尚未刷新</span>
      <label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:8px;font-weight:700;">
        <input id="autoRefresh" type="checkbox" style="width:auto;min-height:auto;" />
        每 5 秒自动刷新
      </label>
    </footer>
  </main>

  <script>
    const API_BASE = "/api/v1/knowledge-graph";
    const state = {
      jobs: [],
      loading: false,
      autoTimer: null,
      rowActions: new Set(),
      graph: {
        nodes: [],
        edges: [],
        animationId: null,
        draggingId: null,
        hoveredId: null,
        ticks: 0
      }
    };

    const el = {
      status: document.getElementById("status"),
      limit: document.getElementById("limit"),
      dataSourceId: document.getElementById("dataSourceId"),
      refreshBtn: document.getElementById("refreshBtn"),
      backfillBtn: document.getElementById("backfillBtn"),
      batchBuildBtn: document.getElementById("batchBuildBtn"),
      batchRebuildBtn: document.getElementById("batchRebuildBtn"),
      fusionBtn: document.getElementById("fusionBtn"),
      notice: document.getElementById("notice"),
      runningRows: document.getElementById("runningRows"),
      failedRows: document.getElementById("failedRows"),
      successRows: document.getElementById("successRows"),
      lastLoaded: document.getElementById("lastLoaded"),
      autoRefresh: document.getElementById("autoRefresh"),
      countAll: document.getElementById("countAll"),
      countQueued: document.getElementById("countQueued"),
      countRunning: document.getElementById("countRunning"),
      countSuccess: document.getElementById("countSuccess"),
      countFailed: document.getElementById("countFailed"),
      runningCount: document.getElementById("runningCount"),
      failedCount: document.getElementById("failedCount"),
      successCount: document.getElementById("successCount"),
      graphLimit: document.getElementById("graphLimit"),
      graphFilter: document.getElementById("graphFilter"),
      loadGraphBtn: document.getElementById("loadGraphBtn"),
      graphStats: document.getElementById("graphStats"),
      graphSvg: document.getElementById("graphSvg"),
      graphDetailTitle: document.getElementById("graphDetailTitle"),
      graphDetail: document.getElementById("graphDetail")
    };

    function buildQuery(params) {
      const query = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          query.set(key, String(value).trim());
        }
      });
      const text = query.toString();
      return text ? `?${text}` : "";
    }

    async function request(url, options) {
      const response = await fetch(url, {
        headers: { "Accept": "application/json" },
        ...options
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `HTTP ${response.status}`);
      }
      return response.json();
    }

    function showNotice(message, isError) {
      el.notice.textContent = message;
      el.notice.className = isError ? "notice error" : "notice";
      el.notice.style.display = message ? "block" : "none";
    }

    function formatTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function numberValue(value) {
      const number = Number(value ?? 0);
      return Number.isFinite(number) ? number : 0;
    }

    function coverageItems(summary) {
      const data = summary && typeof summary === "object" ? summary : {};
      return [
        ["总 chunk 数", numberValue(data.chunkCount)],
        ["成功抽取 chunk", numberValue(data.extractedChunkCount)],
        ["批次数", numberValue(data.batchCount)],
        ["失败批次", numberValue(data.failedBatchCount)],
        ["每批 chunk", numberValue(data.chunkBatchSize)],
        ["实体提及", numberValue(data.entityMentions)],
        ["关系数", numberValue(data.relations)],
        ["融合簇", numberValue(data.entityFusionGroups)],
        ["同义边", numberValue(data.entityFusionSameAsEdges)]
      ];
    }

    function renderCoverage(summary) {
      return `<div class="coverage-grid">${coverageItems(summary).map(([label, value]) => `
        <div class="coverage-item">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `).join("")}</div>`;
    }

    function statusClass(status) {
      const normalized = String(status || "").toLowerCase();
      return ["queued", "running", "success", "failed"].includes(normalized) ? normalized : "queued";
    }

    function setBusy(isBusy) {
      state.loading = isBusy;
      el.refreshBtn.disabled = isBusy;
      el.backfillBtn.disabled = isBusy;
      el.batchBuildBtn.disabled = isBusy;
      el.batchRebuildBtn.disabled = isBusy;
      el.fusionBtn.disabled = isBusy;
      el.refreshBtn.textContent = isBusy ? "刷新中..." : "刷新";
    }

    function renderCounts() {
      const counts = state.jobs.reduce((acc, job) => {
        const key = String(job.status || "unknown").toLowerCase();
        acc[key] = (acc[key] || 0) + 1;
        acc.all += 1;
        return acc;
      }, { all: 0 });
      el.countAll.textContent = counts.all || 0;
      el.countQueued.textContent = counts.queued || 0;
      el.countRunning.textContent = counts.running || 0;
      el.countSuccess.textContent = counts.success || 0;
      el.countFailed.textContent = counts.failed || 0;
    }

    function renderJobRows(jobs, emptyText) {
      if (!jobs.length) {
        return `<div class="empty">${escapeHtml(emptyText)}</div>`;
      }
      return jobs.map(job => {
        const id = escapeHtml(job.id);
        const sourceFileId = escapeHtml(job.sourceFileId);
        const sourceFileShort = sourceFileId ? `${sourceFileId.slice(0, 8)}...` : "-";
        const docId = escapeHtml(job.docId);
        const docShort = docId ? `${docId.slice(0, 8)}...` : "-";
        const actionBusy = state.rowActions.has(job.id);
        const normalizedStatus = String(job.status || "").toLowerCase();
        const canRetry = normalizedStatus === "failed" || normalizedStatus === "success";
        const error = job.errorMessage ? `<div class="job-error">${escapeHtml(job.errorMessage)}</div>` : "";
        const coverage = renderCoverage(job.outputSummary);
        const action = canRetry
          ? `<button type="button" class="danger" data-job-id="${id}" ${actionBusy ? "disabled" : ""}>${actionBusy ? "提交中..." : "重新开始"}</button>`
          : `<span class="muted">-</span>`;
        return `
          <article class="job-card">
            <div class="job-card-head">
              <div class="job-title">
                <strong title="${docId}">${docShort}</strong>
                <span title="${sourceFileId}">文件 ${sourceFileShort}</span>
              </div>
              <span class="badge ${statusClass(job.status)}">${escapeHtml(job.status || "-")}</span>
            </div>
            <div class="muted">阶段：${escapeHtml(job.stage || "-")} / 触发：${escapeHtml(job.triggerSource || "-")}</div>
            ${coverage}
            ${error}
            <div class="muted">更新时间：${escapeHtml(formatTime(job.updatedAt || job.createdAt))}</div>
            <div class="actions" style="justify-content:flex-start;">${action}</div>
          </article>
        `;
      }).join("");
    }

    function renderRows() {
      const running = state.jobs.filter(job => ["queued", "running"].includes(String(job.status || "").toLowerCase()));
      const failed = state.jobs.filter(job => String(job.status || "").toLowerCase() === "failed");
      const success = state.jobs.filter(job => String(job.status || "").toLowerCase() === "success");
      el.runningCount.textContent = running.length;
      el.failedCount.textContent = failed.length;
      el.successCount.textContent = success.length;
      el.runningRows.innerHTML = renderJobRows(running, "暂无运行中的图谱任务");
      el.failedRows.innerHTML = renderJobRows(failed, "暂无失败任务");
      el.successRows.innerHTML = renderJobRows(success, "暂无成功任务");
    }

    function render() {
      renderCounts();
      renderRows();
    }

    function colorForType(type) {
      const normalized = String(type || "").toLowerCase();
      if (normalized.includes("org") || normalized.includes("机构")) return "#2563eb";
      if (normalized.includes("person") || normalized.includes("人")) return "#047857";
      if (normalized.includes("policy") || normalized.includes("制度")) return "#b45309";
      if (normalized.includes("metric") || normalized.includes("指标")) return "#7c3aed";
      if (normalized.includes("date") || normalized.includes("时间")) return "#db2777";
      if (normalized.includes("concept") || normalized.includes("概念")) return "#0891b2";
      return "#475569";
    }

    function hashText(text) {
      let hash = 0;
      for (let index = 0; index < String(text).length; index += 1) {
        hash = ((hash << 5) - hash + String(text).charCodeAt(index)) | 0;
      }
      return Math.abs(hash);
    }

    function graphPointFromEvent(event) {
      const rect = el.graphSvg.getBoundingClientRect();
      const viewBox = el.graphSvg.viewBox.baseVal;
      return {
        x: ((event.clientX - rect.left) / Math.max(1, rect.width)) * viewBox.width,
        y: ((event.clientY - rect.top) / Math.max(1, rect.height)) * viewBox.height
      };
    }

    function stopGraphAnimation() {
      if (state.graph.animationId) {
        window.cancelAnimationFrame(state.graph.animationId);
        state.graph.animationId = null;
      }
    }

    function prepareGraph(nodes, edges, width, height) {
      const previous = new Map(state.graph.nodes.map(node => [node.id, node]));
      const degree = new Map(nodes.map(node => [node.id, 0]));
      edges.forEach(edge => {
        degree.set(edge.source, (degree.get(edge.source) || 0) + 1);
        degree.set(edge.target, (degree.get(edge.target) || 0) + 1);
      });
      return nodes.map((node, index) => {
        const old = previous.get(node.id);
        if (old) {
          return {
            ...node,
            x: old.x,
            y: old.y,
            vx: old.vx || 0,
            vy: old.vy || 0,
            degree: degree.get(node.id) || 0,
            fixed: old.fixed || false
          };
        }
        const seed = hashText(node.id);
        const angle = (Math.PI * 2 * index) / Math.max(1, nodes.length) + ((seed % 25) / 200);
        const ring = index % 2 === 0 ? 0.39 : 0.29;
        const radiusX = width * ring;
        const radiusY = height * (ring * 0.72);
        return {
          ...node,
          x: width / 2 + Math.cos(angle) * radiusX,
          y: height / 2 + Math.sin(angle) * radiusY,
          vx: 0,
          vy: 0,
          degree: degree.get(node.id) || 0,
          fixed: false
        };
      });
    }

    function updateGraphDom() {
      const nodes = state.graph.nodes;
      const nodeById = new Map(nodes.map(node => [node.id, node]));
      el.graphSvg.querySelectorAll("[data-edge-id]").forEach(edgeEl => {
        const edge = state.graph.edges.find(item => item.id === edgeEl.getAttribute("data-edge-id"));
        if (!edge) return;
        const source = nodeById.get(edge.source);
        const target = nodeById.get(edge.target);
        if (!source || !target) return;
        const line = edgeEl.querySelector("line");
        const text = edgeEl.querySelector("text");
        line.setAttribute("x1", source.x.toFixed(1));
        line.setAttribute("y1", source.y.toFixed(1));
        line.setAttribute("x2", target.x.toFixed(1));
        line.setAttribute("y2", target.y.toFixed(1));
        text.setAttribute("x", ((source.x + target.x) / 2).toFixed(1));
        text.setAttribute("y", ((source.y + target.y) / 2).toFixed(1));
      });
      el.graphSvg.querySelectorAll("[data-node-id]").forEach(nodeEl => {
        const node = nodeById.get(nodeEl.getAttribute("data-node-id"));
        if (!node) return;
        nodeEl.setAttribute("transform", `translate(${node.x.toFixed(1)} ${node.y.toFixed(1)})`);
      });
    }

    function tickGraph(width, height) {
      const nodes = state.graph.nodes;
      const edges = state.graph.edges;
      const nodeById = new Map(nodes.map(node => [node.id, node]));
      const centerX = width / 2;
      const centerY = height / 2;
      for (let i = 0; i < nodes.length; i += 1) {
        for (let j = i + 1; j < nodes.length; j += 1) {
          const a = nodes[i];
          const b = nodes[j];
          let dx = a.x - b.x;
          let dy = a.y - b.y;
          let distanceSq = dx * dx + dy * dy;
          if (distanceSq < 1) {
            dx = 0.1;
            dy = 0.1;
            distanceSq = 1;
          }
          const force = Math.min(9, 12500 / distanceSq);
          const distance = Math.sqrt(distanceSq);
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          if (!a.fixed) {
            a.vx += fx;
            a.vy += fy;
          }
          if (!b.fixed) {
            b.vx -= fx;
            b.vy -= fy;
          }
        }
      }
      edges.forEach(edge => {
        const source = nodeById.get(edge.source);
        const target = nodeById.get(edge.target);
        if (!source || !target) return;
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const distance = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        const desired = 210 + Math.min(110, (source.degree + target.degree) * 4);
        const force = (distance - desired) * 0.006;
        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        if (!source.fixed) {
          source.vx += fx;
          source.vy += fy;
        }
        if (!target.fixed) {
          target.vx -= fx;
          target.vy -= fy;
        }
      });
      nodes.forEach(node => {
        if (!node.fixed) {
          node.vx += (centerX - node.x) * 0.0015;
          node.vy += (centerY - node.y) * 0.0015;
          node.vx *= 0.78;
          node.vy *= 0.78;
          node.x += node.vx;
          node.y += node.vy;
          node.x = Math.max(64, Math.min(width - 64, node.x));
          node.y = Math.max(64, Math.min(height - 64, node.y));
        }
      });
      updateGraphDom();
      state.graph.ticks += 1;
      if (state.graph.ticks < 260 || state.graph.draggingId) {
        state.graph.animationId = window.requestAnimationFrame(() => tickGraph(width, height));
      } else {
        state.graph.animationId = null;
      }
    }

    function startGraphAnimation(width, height) {
      stopGraphAnimation();
      state.graph.ticks = 0;
      state.graph.animationId = window.requestAnimationFrame(() => tickGraph(width, height));
    }

    function applyGraphFocus(id) {
      state.graph.hoveredId = id;
      const connected = new Set(id ? [id] : []);
      state.graph.edges.forEach(edge => {
        if (edge.source === id || edge.target === id || edge.id === id) {
          connected.add(edge.source);
          connected.add(edge.target);
          connected.add(edge.id);
        }
      });
      el.graphSvg.classList.toggle("is-focused", Boolean(id));
      el.graphSvg.querySelectorAll(".graph-node").forEach(nodeEl => {
        nodeEl.classList.toggle("is-active", connected.has(nodeEl.getAttribute("data-node-id")));
      });
      el.graphSvg.querySelectorAll(".graph-edge").forEach(edgeEl => {
        edgeEl.classList.toggle("is-active", connected.has(edgeEl.getAttribute("data-edge-id")));
      });
    }

    function mergeVisibleEdges(edges) {
      const grouped = new Map();
      edges.forEach(edge => {
        const key = `${edge.source}||${edge.target}||${edge.type || "related_to"}`;
        const reverseKey = `${edge.target}||${edge.source}||${edge.type || "related_to"}`;
        const existingKey = grouped.has(key) ? key : (grouped.has(reverseKey) ? reverseKey : key);
        const current = grouped.get(existingKey);
        if (!current) {
          grouped.set(existingKey, {
            ...edge,
            factCount: 1,
            labels: edge.label ? [edge.label] : [],
            docIds: Array.isArray(edge.docIds) ? [...edge.docIds] : []
          });
          return;
        }
        current.factCount += 1;
        if (edge.label && current.labels.length < 5 && !current.labels.includes(edge.label)) {
          current.labels.push(edge.label);
        }
        if (Array.isArray(edge.docIds)) {
          edge.docIds.forEach(docId => {
            if (docId && !current.docIds.includes(docId)) current.docIds.push(docId);
          });
        }
        current.confidence = Math.max(Number(current.confidence || 0), Number(edge.confidence || 0));
      });
      return [...grouped.values()].map(edge => ({
        ...edge,
        label: edge.labels && edge.labels.length ? edge.labels[0] : edge.label,
        docIds: (edge.docIds || []).slice(0, 5)
      }));
    }

    function renderGraph(graph) {
      stopGraphAnimation();
      const rawNodes = Array.isArray(graph.nodes) ? graph.nodes : [];
      const rawEdges = Array.isArray(graph.edges) ? graph.edges : [];
      const filter = el.graphFilter.value.trim().toLowerCase();
      const visibleNodeIds = new Set(rawNodes
        .filter(node => !filter || String(node.label || "").toLowerCase().includes(filter))
        .map(node => node.id));
      const visibleFacts = filter
        ? rawEdges.filter(edge => visibleNodeIds.has(edge.source) || visibleNodeIds.has(edge.target))
        : rawEdges;
      visibleFacts.forEach(edge => {
        visibleNodeIds.add(edge.source);
        visibleNodeIds.add(edge.target);
      });
      const nodes = rawNodes.filter(node => visibleNodeIds.has(node.id));
      const edges = mergeVisibleEdges(visibleFacts);
      const width = Math.max(900, el.graphSvg.clientWidth || 900);
      const height = 680;
      const positioned = prepareGraph(nodes, edges, width, height);
      state.graph.nodes = positioned;
      state.graph.edges = edges;
      const stats = graph.stats || {};
      const totalText = `全局实体 ${numberValue(stats.entities)} · 状态 ${numberValue(stats.states)} · 事实 ${numberValue(stats.facts)} · 融合簇 ${numberValue(stats.clusters)}`;
      el.graphStats.textContent = `${totalText} · 当前显示 ${nodes.length} 实体 / ${edges.length} 实体关系 / ${visibleFacts.length} 事实`;
      const nodeById = new Map(positioned.map(node => [node.id, node]));
      const edgeMarkup = edges.map(edge => {
        const source = nodeById.get(edge.source);
        const target = nodeById.get(edge.target);
        if (!source || !target) return "";
        const labelX = (source.x + target.x) / 2;
        const labelY = (source.y + target.y) / 2;
        return `
          <g class="graph-edge" data-edge-id="${escapeHtml(edge.id)}">
            <line x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}" />
            <text x="${labelX}" y="${labelY}" text-anchor="middle">${escapeHtml(edge.factCount > 1 ? `${edge.type || ""} x${edge.factCount}` : edge.type || "")}</text>
          </g>
        `;
      }).join("");
      const nodeMarkup = positioned.map(node => {
        const radius = Math.min(32, 13 + Math.sqrt(node.degree + 1) * 5);
        const label = String(node.label || "未命名实体");
        const shortLabel = label.length > 12 ? `${label.slice(0, 12)}...` : label;
        return `
          <g class="graph-node" data-node-id="${escapeHtml(node.id)}" transform="translate(${node.x.toFixed(1)} ${node.y.toFixed(1)})">
            <circle cx="0" cy="0" r="${radius}" fill="${colorForType(node.type)}" opacity="0.94" />
            <text x="0" y="${radius + 16}" text-anchor="middle">${escapeHtml(shortLabel)}</text>
          </g>
        `;
      }).join("");
      el.graphSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      el.graphSvg.innerHTML = edges.length || nodes.length
        ? `${edgeMarkup}${nodeMarkup}`
        : `<text x="${width / 2}" y="${height / 2}" fill="#69758a" font-size="14" text-anchor="middle">暂无可展示图谱，请先完成图谱构建</text>`;
      el.graphSvg.__visibleGraph = { nodes: positioned, edges };
      if (edges.length || nodes.length) startGraphAnimation(width, height);
    }

    async function loadGraph(silent) {
      el.loadGraphBtn.disabled = true;
      el.loadGraphBtn.textContent = "加载中...";
      if (!silent) showNotice("", false);
      try {
        const targetEntities = Math.max(10, Math.min(Number(el.graphLimit.value || 50), 120));
        el.graphLimit.value = String(targetEntities);
        const graph = await request(`${API_BASE}/view${buildQuery({ targetEntities })}`);
        el.graphSvg.__rawGraph = graph;
        renderGraph(graph);
      } catch (error) {
        el.graphStats.textContent = "图谱加载失败";
        showNotice(`加载图谱失败：${error.message || error}`, true);
      } finally {
        el.loadGraphBtn.disabled = false;
        el.loadGraphBtn.textContent = "查看图谱";
      }
    }

    async function loadJobs(silent) {
      if (state.loading) return;
      setBusy(true);
      if (!silent) showNotice("", false);
      try {
        const limit = Math.max(1, Math.min(Number(el.limit.value || 100), 200));
        el.limit.value = String(limit);
        const jobs = await request(`${API_BASE}/build-jobs${buildQuery({ status: el.status.value, limit })}`);
        state.jobs = Array.isArray(jobs) ? jobs : [];
        el.lastLoaded.textContent = `最后刷新：${new Date().toLocaleString()}`;
        render();
      } catch (error) {
        showNotice(`加载图谱任务失败：${error.message || error}`, true);
      } finally {
        setBusy(false);
      }
    }

    async function backfillMissing() {
      if (state.loading) return;
      setBusy(true);
      showNotice("", false);
      try {
        const limit = Math.max(1, Math.min(Number(el.limit.value || 200), 5000));
        const dataSourceId = el.dataSourceId.value.trim();
        const result = await request(`${API_BASE}/build-jobs/backfill-missing${buildQuery({ limit, dataSourceId })}`, { method: "POST" });
        showNotice(`补建任务已提交：匹配 ${result.matched ?? 0} 个，入队 ${result.queued ?? 0} 个。`, false);
        await loadJobs(true);
      } catch (error) {
        showNotice(`提交补建失败：${error.message || error}`, true);
      } finally {
        setBusy(false);
      }
    }

    async function submitBatchBuild(rebuildSuccess) {
      if (state.loading) return;
      setBusy(true);
      showNotice("", false);
      try {
        const limit = Math.max(1, Math.min(Number(el.limit.value || 200), 5000));
        const dataSourceId = el.dataSourceId.value.trim();
        const result = await request(`${API_BASE}/build-jobs/batch${buildQuery({ limit, dataSourceId, rebuildSuccess })}`, { method: "POST" });
        showNotice(`批量图谱抽取已提交：批次 ${result.graphBatchId || "-"}，匹配 ${result.matched ?? 0} 个，入队 ${result.queued ?? 0} 个。`, false);
        await loadJobs(true);
      } catch (error) {
        showNotice(`批量提交失败：${error.message || error}`, true);
      } finally {
        setBusy(false);
      }
    }

    async function startFusion() {
      if (state.loading) return;
      setBusy(true);
      showNotice("", false);
      try {
        const result = await request(`${API_BASE}/fusion-jobs/start`, { method: "POST" });
        const changed = Number(result.entityFusionBackfilled ?? 0) + Number(result.entityFusionGroups ?? 0) + Number(result.entityFusionSameAsEdges ?? 0);
        const message = changed > 0
          ? `实体融合完成：范围 全部待融合，历史补齐 ${result.entityFusionBackfilled ?? 0} 个，融合簇 ${result.entityFusionGroups ?? 0} 个，同义边 ${result.entityFusionSameAsEdges ?? 0} 条。`
          : "实体融合已执行：当前没有新的待融合实体。新增或重建图谱后再执行会处理新批次。";
        showNotice(message, false);
        await Promise.all([loadJobs(true), loadGraph(true)]);
        showNotice(message, false);
      } catch (error) {
        showNotice(`实体融合失败：${error.message || error}`, true);
      } finally {
        setBusy(false);
      }
    }

    async function retryJob(jobId) {
      if (!jobId || state.rowActions.has(jobId)) return;
      state.rowActions.add(jobId);
      renderRows();
      showNotice("", false);
      try {
        const result = await request(`${API_BASE}/build-jobs/${encodeURIComponent(jobId)}/retry`, { method: "POST" });
        showNotice(result.queued ? `任务已重新进入运行队列，批次 ${result.graphBatchId || "-"}。` : (result.message || "任务未重新入队。"), !result.queued);
        await loadJobs(true);
      } catch (error) {
        showNotice(`重新开始失败：${error.message || error}`, true);
      } finally {
        state.rowActions.delete(jobId);
        renderRows();
      }
    }

    el.refreshBtn.addEventListener("click", () => loadJobs(false));
    el.backfillBtn.addEventListener("click", backfillMissing);
    el.batchBuildBtn.addEventListener("click", () => submitBatchBuild(false));
    el.batchRebuildBtn.addEventListener("click", () => submitBatchBuild(true));
    el.fusionBtn.addEventListener("click", startFusion);
    el.loadGraphBtn.addEventListener("click", loadGraph);
    el.graphFilter.addEventListener("input", () => {
      const graphData = el.graphSvg.__rawGraph;
      if (graphData) renderGraph(graphData);
    });
    el.graphSvg.addEventListener("pointerdown", event => {
      const nodeEl = event.target.closest("[data-node-id]");
      if (!nodeEl) return;
      const nodeId = nodeEl.getAttribute("data-node-id");
      const item = state.graph.nodes.find(node => node.id === nodeId);
      if (!item) return;
      const point = graphPointFromEvent(event);
      state.graph.draggingId = nodeId;
      item.fixed = true;
      item.x = point.x;
      item.y = point.y;
      item.vx = 0;
      item.vy = 0;
      nodeEl.setPointerCapture?.(event.pointerId);
      applyGraphFocus(nodeId);
      updateGraphDom();
      if (!state.graph.animationId) {
        const viewBox = el.graphSvg.viewBox.baseVal;
        startGraphAnimation(viewBox.width || 900, viewBox.height || 680);
      }
    });
    el.graphSvg.addEventListener("pointermove", event => {
      if (!state.graph.draggingId) return;
      const item = state.graph.nodes.find(node => node.id === state.graph.draggingId);
      if (!item) return;
      const viewBox = el.graphSvg.viewBox.baseVal;
      const point = graphPointFromEvent(event);
      item.x = Math.max(42, Math.min((viewBox.width || 900) - 42, point.x));
      item.y = Math.max(42, Math.min((viewBox.height || 680) - 42, point.y));
      item.vx = 0;
      item.vy = 0;
      updateGraphDom();
    });
    el.graphSvg.addEventListener("pointerup", event => {
      if (!state.graph.draggingId) return;
      const item = state.graph.nodes.find(node => node.id === state.graph.draggingId);
      if (item) item.fixed = false;
      state.graph.draggingId = null;
      event.target.releasePointerCapture?.(event.pointerId);
    });
    el.graphSvg.addEventListener("pointerleave", () => {
      if (state.graph.draggingId) return;
      applyGraphFocus(null);
    });
    el.graphSvg.addEventListener("pointerover", event => {
      const node = event.target.closest("[data-node-id]");
      const edge = event.target.closest("[data-edge-id]");
      if (node) applyGraphFocus(node.getAttribute("data-node-id"));
      else if (edge) applyGraphFocus(edge.getAttribute("data-edge-id"));
    });
    el.graphSvg.addEventListener("pointerout", event => {
      if (state.graph.draggingId) return;
      if (!el.graphSvg.contains(event.relatedTarget)) applyGraphFocus(null);
    });
    el.status.addEventListener("change", () => loadJobs(false));
    el.limit.addEventListener("change", () => loadJobs(false));
    el.autoRefresh.addEventListener("change", () => {
      if (state.autoTimer) {
        window.clearInterval(state.autoTimer);
        state.autoTimer = null;
      }
      if (el.autoRefresh.checked) {
        state.autoTimer = window.setInterval(() => loadJobs(true), 5000);
      }
    });
    document.body.addEventListener("click", event => {
      const button = event.target.closest("button[data-job-id]");
      if (button) retryJob(button.getAttribute("data-job-id"));
      const node = event.target.closest("[data-node-id]");
      if (node && el.graphSvg.__visibleGraph) {
        const item = el.graphSvg.__visibleGraph.nodes.find(entry => entry.id === node.getAttribute("data-node-id"));
        if (item) {
          el.graphDetailTitle.textContent = item.label || "实体";
          el.graphDetail.textContent = `类型：${item.type || "-"}\n规范名：${item.canonicalName || item.label || "-"}\n融合簇：${item.fusionKey || "-"}\n状态数：${item.stateCount ?? "-"}\n实体ID：${item.id}\n连接数：${item.degree || 0}`;
        }
      }
      const edge = event.target.closest("[data-edge-id]");
      if (edge && el.graphSvg.__visibleGraph) {
        const item = el.graphSvg.__visibleGraph.edges.find(entry => entry.id === edge.getAttribute("data-edge-id"));
        if (item) {
          el.graphDetailTitle.textContent = item.type || "关系";
          el.graphDetail.textContent = `关系：${item.type || "-"}\n事实数量：${item.factCount || 1}\n代表事实：${item.label || "-"}\n置信度：${item.confidence ?? "-"}\n证据文档：${(item.docIds || []).join("\\n") || "-"}`;
        }
      }
    });

    loadJobs(false);
    loadGraph();
  </script>
</body>
</html>
