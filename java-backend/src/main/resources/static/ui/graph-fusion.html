<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Fusion</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/ui/assets/graph-pipeline.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="eyebrow">Stage 5</div><h1>实体融合</h1></div>
      <nav class="nav"><a href="/ui/graph-pipeline.html">流程总览</a><a href="/ui/graph-structure.html">结构增强</a><a href="/ui/graph.html">下一步：图谱浏览</a></nav>
    </header>
    <div id="stageNav"></div>
    <div id="notice" class="notice"></div>
    <section class="panel">
      <div class="section-head">
        <h2>融合动作</h2>
        <span>跨文档同名优先融合；状态融合和演化链可以独立执行。</span>
      </div>
      <div class="actions">
        <button id="entityBtn" class="primary" type="button">执行实体融合</button>
        <button id="stateBtn" type="button">执行状态融合</button>
        <button id="transitionBtn" type="button">构建演化链</button>
        <button id="refreshBtn" type="button">刷新</button>
      </div>
    </section>
    <section class="metrics" id="metrics"></section>
    <section class="grid two">
      <div class="panel">
        <div class="section-head"><h2>融合任务记录</h2><span id="jobCount">0</span></div>
        <div id="jobs" class="list"></div>
      </div>
      <div class="panel">
        <div class="section-head"><h2>阶段说明</h2><span>避免重复融合</span></div>
        <div class="timeline">
          <div class="step"><span class="step-no">1</span><div><strong>实体融合</strong><div class="muted">按规范名、同名、别名、证据批次生成实体簇。</div></div></div>
          <div class="step"><span class="step-no">2</span><div><strong>状态融合</strong><div class="muted">把同一阶段在不同文档重复描述的状态合并。</div></div></div>
          <div class="step"><span class="step-no">3</span><div><strong>演化链</strong><div class="muted">只在状态之间建立先后或显式演化关系。</div></div></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import { API_BASE, buildQuery, escapeHtml, formatTime, metric, request, showNotice, stageNav, statusBadge } from "/ui/assets/graph-pipeline.js";
    const el = {
      stageNav: document.getElementById("stageNav"),
      notice: document.getElementById("notice"),
      metrics: document.getElementById("metrics"),
      jobs: document.getElementById("jobs"),
      jobCount: document.getElementById("jobCount"),
      entityBtn: document.getElementById("entityBtn"),
      stateBtn: document.getElementById("stateBtn"),
      transitionBtn: document.getElementById("transitionBtn"),
      refreshBtn: document.getElementById("refreshBtn")
    };
    el.stageNav.innerHTML = stageNav("fusion");
    function renderJob(job) {
      const s = job.outputSummary || job.output_summary || {};
      return `<article class="card">
        <div class="card-head"><div class="card-title"><strong>${escapeHtml(job.stage || job.jobType || "fusion")}</strong><span>${escapeHtml(job.id || "")}</span></div><span class="badge ${statusBadge(job.status)}">${escapeHtml(job.status || "-")}</span></div>
        <div class="kv-grid">
          <div class="kv"><span>实体簇</span><strong>${escapeHtml(s.entityFusionGroups ?? "-")}</strong></div>
          <div class="kv"><span>状态簇</span><strong>${escapeHtml(s.stateFusionGroups ?? "-")}</strong></div>
          <div class="kv"><span>演化边</span><strong>${escapeHtml(s.transitionEdges ?? "-")}</strong></div>
          <div class="kv"><span>时间</span><strong>${escapeHtml(formatTime(job.updatedAt || job.createdAt))}</strong></div>
        </div>
      </article>`;
    }
    async function load() {
      const [stats, jobs] = await Promise.all([
        request(`${API_BASE}/stats`),
        request(`${API_BASE}/fusion-jobs${buildQuery({ limit: 50 })}`)
      ]);
      el.metrics.innerHTML = [
        metric("实体", stats.entities ?? 0),
        metric("关系", stats.relationships ?? stats.relations ?? 0),
        metric("融合簇", stats.clusters ?? 0),
        metric("状态", stats.states ?? stats.entityStates ?? 0),
        metric("演化边", stats.transitions ?? stats.transitionEdges ?? 0)
      ].join("");
      const rows = Array.isArray(jobs) ? jobs : [];
      el.jobCount.textContent = rows.length;
      el.jobs.innerHTML = rows.length ? rows.map(renderJob).join("") : `<div class="empty">还没有融合任务记录。</div>`;
    }
    async function run(url, label) {
      try {
        showNotice(el.notice, "", false);
        const result = await request(url, { method: "POST" });
        showNotice(el.notice, `${label}完成：${JSON.stringify(result)}`, false);
        await load();
      } catch (error) {
        showNotice(el.notice, `${label}失败：${error.message || error}`, true);
      }
    }
    el.entityBtn.addEventListener("click", () => run(`${API_BASE}/fusion-jobs/start`, "实体融合"));
    el.stateBtn.addEventListener("click", () => run(`${API_BASE}/fusion-jobs/state/start`, "状态融合"));
    el.transitionBtn.addEventListener("click", () => run(`${API_BASE}/fusion-jobs/transitions/start`, "演化链构建"));
    el.refreshBtn.addEventListener("click", () => load().catch(error => showNotice(el.notice, `刷新失败：${error.message || error}`, true)));
    load().catch(error => showNotice(el.notice, `加载融合页失败：${error.message || error}`, true));
  </script>
</body>
</html>
