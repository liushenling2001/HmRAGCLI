<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HmRAGCLI Query</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #fafafa; --bg-card: #ffffff; --bg-panel: #f5f5f5; --bg-input: #ffffff; --bg-hover: #f0f0f0; --bg-active: #e8e8e8;
        --text: #1a1a1a; --text-muted: #666666; --text-soft: #999999; --text-disabled: #cccccc;
        --border: #d4d4d4; --border-strong: #1a1a1a; --border-focus: #1a1a1a; --border-light: #e8e8e8;
        --success: #059669; --success-bg: #ecfdf5; --success-text: #047857;
        --warning: #d97706; --warning-bg: #fffbeb; --warning-text: #b45309;
        --error: #dc2626; --error-bg: #fef2f2; --error-text: #b91c1c;
        --info: #2563eb; --info-bg: #eff6ff; --info-text: #1d4ed8;
        --font-display: Georgia, 'Times New Roman', serif;
        --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace;
        --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px; --text-xl: 18px; --text-2xl: 20px; --text-3xl: 24px; --text-4xl: 30px;
        --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px;
        --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px; --radius-full: 9999px;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 2px 4px rgba(0,0,0,0.06); --shadow-lg: 0 4px 8px rgba(0,0,0,0.08);
        --transition-fast: 120ms ease; --transition-base: 180ms ease; --transition-slow: 280ms ease;
        --max-width: 1400px; --header-height: 64px;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; font-size: 16px; -webkit-font-smoothing: antialiased; }
      body { min-height: 100%; font-family: var(--font-body); font-size: var(--text-base); line-height: 1.6; color: var(--text); background-color: var(--bg); }
    </style>
    <script type="module" crossorigin src="/ui/assets/query.js"></script>
    <link rel="modulepreload" crossorigin href="/ui/assets/base.js">
    <link rel="stylesheet" crossorigin href="/ui/assets/base.css">
    <link rel="stylesheet" crossorigin href="/ui/assets/query.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
