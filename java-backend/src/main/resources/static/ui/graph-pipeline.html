<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HmRAGCLI Graph Pipeline</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/ui/assets/graph-pipeline.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">HmRAGCLI</div>
        <h1>图谱流水线工作台</h1>
      </div>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/ui/ops.html">运维台</a>
        <a href="http://127.0.0.1:7474/browser/" target="_blank" rel="noreferrer">Neo4j</a>
      </nav>
    </header>
    <div id="stageNav"></div>
    <div id="notice" class="notice"></div>
    <section class="panel">
      <div class="section-head">
        <h2>运行开关</h2>
        <span>控制索引完成后的自动动作，避免大批量文件入库时直接压到图谱抽取。</span>
      </div>
      <div class="runtime-switch">
        <label class="switch-row">
          <input id="autoBuildAfterIndex" type="checkbox" />
          <span class="switch-ui"></span>
          <span><strong>索引完成后自动建基础图谱</strong><small>关闭后只完成入库和索引，需要到“抽取任务”页手动处理未成功文件。</small></span>
        </label>
        <span id="autoBuildStatus" class="badge">读取中</span>
      </div>
    </section>
    <section class="panel">
      <div class="section-head">
        <h2>文档画像回填</h2>
        <span>给旧索引文档补画像，后续图谱抽取会按画像选择更合适的策略。</span>
      </div>
      <div class="runtime-switch">
        <div class="profile-summary" id="profileSummary">
          <span>可补文档 <strong id="profileEligible">-</strong></span>
          <span>已有画像 <strong id="profiledDocuments">-</strong></span>
          <span>缺画像 <strong id="missingProfiles">-</strong></span>
        </div>
        <button id="backfillProfiles" class="primary" type="button">补文档画像</button>
      </div>
      <div id="profileResult" class="muted">点击后每次最多处理 1000 篇，完成后会显示本次处理、成功、失败和剩余数量。</div>
    </section>
    <section class="metrics" id="metrics"></section>
    <section class="panel">
      <div class="section-head">
        <h2>按阶段推进</h2>
        <span>每个页面只处理一个阶段：动作、结果、下一步。</span>
      </div>
      <div class="grid" id="cards"></div>
    </section>
  </main>
  <script type="module">
    import { API_BASE, buildQuery, escapeHtml, metric, request, showNotice, stageNav, stages } from "/ui/assets/graph-pipeline.js";

    const el = {
      stageNav: document.getElementById("stageNav"),
      notice: document.getElementById("notice"),
      metrics: document.getElementById("metrics"),
      cards: document.getElementById("cards"),
      autoBuildAfterIndex: document.getElementById("autoBuildAfterIndex"),
      autoBuildStatus: document.getElementById("autoBuildStatus"),
      profileEligible: document.getElementById("profileEligible"),
      profiledDocuments: document.getElementById("profiledDocuments"),
      missingProfiles: document.getElementById("missingProfiles"),
      backfillProfiles: document.getElementById("backfillProfiles"),
      profileResult: document.getElementById("profileResult")
    };
    el.stageNav.innerHTML = stageNav("overview");

    function card(stage, subtitle) {
      return `<a class="card" href="${stage.href}" style="text-decoration:none;color:inherit;">
        <div class="card-head">
          <div class="card-title">
            <strong>${escapeHtml(stage.no)}. ${escapeHtml(stage.label)}</strong>
            <span>${escapeHtml(subtitle)}</span>
          </div>
          <span class="badge info">进入</span>
        </div>
      </a>`;
    }

    function renderRuntimeSettings(settings) {
      const enabled = Boolean(settings && settings.autoBuildAfterIndex);
      el.autoBuildAfterIndex.checked = enabled;
      el.autoBuildStatus.textContent = enabled ? "自动建图已开启" : "自动建图已关闭";
      el.autoBuildStatus.className = enabled ? "badge success" : "badge warning";
    }

    async function loadRuntimeSettings() {
      try {
        renderRuntimeSettings(await request(`${API_BASE}/runtime-settings`));
      } catch (error) {
        el.autoBuildStatus.textContent = "读取失败";
        el.autoBuildStatus.className = "badge error";
        showNotice(el.notice, `读取自动建图开关失败：${error.message || error}`, true);
      }
    }

    async function updateAutoBuildAfterIndex() {
      const enabled = el.autoBuildAfterIndex.checked;
      el.autoBuildAfterIndex.disabled = true;
      try {
        const settings = await request(`${API_BASE}/runtime-settings/auto-build-after-index${buildQuery({ enabled })}`, { method: "POST" });
        renderRuntimeSettings(settings);
        showNotice(el.notice, enabled ? "已开启自动建基础图谱" : "已关闭自动建基础图谱", false);
      } catch (error) {
        el.autoBuildAfterIndex.checked = !enabled;
        showNotice(el.notice, `保存自动建图开关失败：${error.message || error}`, true);
      } finally {
        el.autoBuildAfterIndex.disabled = false;
      }
    }

    function renderProfileStats(stats) {
      el.profileEligible.textContent = stats.eligibleDocuments ?? 0;
      el.profiledDocuments.textContent = stats.profiledDocuments ?? 0;
      el.missingProfiles.textContent = stats.missingProfiles ?? stats.remainingMissing ?? 0;
    }

    async function loadProfileStats() {
      try {
        renderProfileStats(await request("/api/v1/document-profiles/stats"));
      } catch (error) {
        el.profileResult.textContent = `文档画像统计读取失败：${error.message || error}`;
      }
    }

    async function backfillProfiles() {
      el.backfillProfiles.disabled = true;
      el.profileResult.textContent = "正在补文档画像，本次最多处理 1000 篇...";
      try {
        const result = await request("/api/v1/document-profiles/backfill?limit=1000", { method: "POST" });
        renderProfileStats(result);
        el.profileResult.textContent = `回填完成：本次选择 ${result.selected ?? 0}，成功 ${result.succeeded ?? 0}，失败 ${result.failed ?? 0}，剩余 ${result.remainingMissing ?? result.missingProfiles ?? 0}`;
        showNotice(el.notice, el.profileResult.textContent, false);
      } catch (error) {
        el.profileResult.textContent = `文档画像回填失败：${error.message || error}`;
        showNotice(el.notice, el.profileResult.textContent, true);
      } finally {
        el.backfillProfiles.disabled = false;
      }
    }

    async function load() {
      try {
        const [stats, jobs, fusionJobs] = await Promise.all([
          request(`${API_BASE}/stats`),
          request(`${API_BASE}/build-jobs${buildQuery({ limit: 200 })}`),
          request(`${API_BASE}/fusion-jobs${buildQuery({ limit: 20 })}`)
        ]);
        const counts = jobs.reduce((acc, job) => {
          const key = String(job.status || "unknown").toLowerCase();
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});
        el.metrics.innerHTML = [
          metric("抽取成功任务", counts.success || 0),
          metric("运行/排队", (counts.running || 0) + (counts.queued || 0)),
          metric("失败任务", counts.failed || 0),
          metric("实体", stats.entities ?? 0),
          metric("事实", stats.facts ?? 0),
          metric("融合簇", stats.clusters ?? 0),
          metric("融合任务", fusionJobs.length || 0)
        ].join("");
        const copy = {
          extract: "提交、重跑、查看每篇文档抽取覆盖。",
          local: "按任务查看局部图谱产出摘要。",
          attributes: "治理属性候选，区分正式属性和候选池。",
          structure: "用文档章节、chunk 关键词补弱关系。",
          fusion: "跨文档同名融合、状态融合、演化链。",
          view: "查看全局图、实体子图和实体详情。",
          quality: "评估覆盖率、候选积压和风险。"
        };
        el.cards.innerHTML = stages.filter(stage => stage.key !== "overview").map(stage => card(stage, copy[stage.key] || "")).join("");
      } catch (error) {
        showNotice(el.notice, `加载流水线总览失败：${error.message || error}`, true);
      }
    }
    el.autoBuildAfterIndex.addEventListener("change", updateAutoBuildAfterIndex);
    el.backfillProfiles.addEventListener("click", backfillProfiles);
    loadRuntimeSettings();
    loadProfileStats();
    load();
  </script>
</body>
</html>
